<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ogro Linked Audio</title>
<style>
  body { font-family: Arial, sans-serif; background:#2f3136; color:#dcddde; text-align:center; padding:20px; margin:0; }
  h1 { color:#fff; font-size:22px; }
  .box { background:#202225; padding:20px; border-radius:8px; max-width:400px; margin:20px auto; }
  button { padding:14px; font-size:16px; margin:8px; width:90%; background:#5865f2; color:#fff; border:none; border-radius:5px; cursor:pointer; }
  button:hover { background:#4752c4; }
  button:disabled { background:#4f545c; cursor:not-allowed; }
  input { padding:12px; font-size:16px; width:85%; margin:8px; border-radius:5px; border:none; }
  #meuid { color:#3ba55d; font-weight:bold; font-size:22px; word-break:break-all; }
  #status { font-size:13px; color:#faa61a; margin-top:15px; }
  .hidden { display:none; }
</style>
</head>
<body>

<h1>🎧 Ogro Linked Audio</h1>
<p style="color:#4f545c; font-size:10px; margin-top:-15px;">build 2</p>

<div id="tela-escolha" class="box">
  <p>Quem e voce nessa transmissao?</p>
  <button onclick="virarMensageiro()">📤 Mensageiro (envia o audio)</button>
  <button onclick="virarReceptor()">📥 Receptor (recebe e toca)</button>
</div>

<div id="tela-mensageiro" class="box hidden">
  <h3>📤 Mensageiro</h3>
  <p>Seu ID (compartilhe com o Receptor):</p>
  <div id="meuid">gerando...</div>
  <p id="status">Iniciando...</p>
</div>

<div id="tela-receptor" class="box hidden">
  <h3>📥 Receptor</h3>
  <p>Cole o ID do Mensageiro:</p>
  <input type="text" id="idalvo" placeholder="ex: ogro-4821">
  <br>
  <button id="btn-conectar" onclick="conectarReceptor()">Conectar e Tocar</button>
  <p id="status2">Aguardando...</p>
  <audio id="player" autoplay controls style="width:100%; margin-top:10px;"></audio>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
const peerConfig = {
  debug: 2,
  config: {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
    ]
  }
};

let peer = null;
let meuStream = null;

function esconderTudo() {
  document.getElementById('tela-escolha').classList.add('hidden');
  document.getElementById('tela-mensageiro').classList.add('hidden');
  document.getElementById('tela-receptor').classList.add('hidden');
}

// ---------------- MENSAGEIRO ----------------
async function virarMensageiro() {
  esconderTudo();
  document.getElementById('tela-mensageiro').classList.remove('hidden');
  const status = document.getElementById('status');

  try {
    status.innerText = 'Pedindo acesso ao audio (escolha o microfone streamsink/monitor)...';
    meuStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
        latency: 0
      }
    });
    status.innerText = 'Audio pronto. Gerando ID...';
  } catch (e) {
    status.innerText = 'Erro ao pegar audio: ' + e.message;
    return;
  }

  const idFixo = 'ogro-' + Math.floor(Math.random()*9000 + 1000);
  peer = new Peer(idFixo, peerConfig);

  peer.on('open', (id) => {
    document.getElementById('meuid').innerText = id;
    status.innerText = '✅ Pronto. Aguardando o Receptor conectar...';
  });

  // So aceita chamadas DEPOIS que o audio (meuStream) ja esta pronto,
  // isso evita o "conectando infinito" de antes (corrida entre call e getUserMedia)
  peer.on('call', (chamada) => {
    status.innerText = '📞 Receptor conectando...';
    chamada.answer(meuStream);
    chamada.on('stream', () => {
      status.innerText = '🔊 Transmitindo em tempo real!';
    });
    chamada.on('close', () => {
      status.innerText = 'Receptor desconectou.';
    });
    chamada.on('error', (e) => {
      status.innerText = 'Erro na chamada: ' + e;
    });
  });

  peer.on('error', (err) => {
    status.innerText = '❌ Erro: ' + err.type;
  });

  peer.on('disconnected', () => {
    status.innerText = '⚠️ Desconectado do servidor, tentando religar...';
    peer.reconnect();
  });
}

// ---------------- RECEPTOR ----------------
function virarReceptor() {
  esconderTudo();
  document.getElementById('tela-receptor').classList.remove('hidden');
  peer = new Peer(peerConfig);
}

function conectarReceptor() {
  const idAlvo = document.getElementById('idalvo').value.trim();
  const status = document.getElementById('status2');
  const btn = document.getElementById('btn-conectar');
  if (!idAlvo) { status.innerText = 'Digite o ID do Mensageiro.'; return; }

  btn.disabled = true;
  status.innerText = '🔄 Conectando (pode levar ate 15s)...';

  const iniciar = () => {
    // Pedimos audio (ate mudo) so porque peer.call exige um stream local pra
    // negociar a chamada - nao usamos esse audio de verdade, so o do notebook.
    navigator.mediaDevices.getUserMedia({audio: true}).then((streamFake) => {
      // Desliga o microfone do celular imediatamente (nao queremos mandar nada, so receber)
      streamFake.getTracks().forEach(t => t.enabled = false);

      const chamada = peer.call(idAlvo, streamFake);

      const timeout = setTimeout(() => {
        status.innerText = '❌ Nao conectou a tempo. Confira o ID e tente de novo.';
        btn.disabled = false;
      }, 15000);

      chamada.on('stream', (streamRemoto) => {
        clearTimeout(timeout);
        document.getElementById('player').srcObject = streamRemoto;
        status.innerText = '🔊 Tocando!';
        btn.disabled = false;
      });
      chamada.on('close', () => {
        status.innerText = 'Chamada encerrada.';
        btn.disabled = false;
      });
      chamada.on('error', (e) => {
        clearTimeout(timeout);
        status.innerText = 'Erro na chamada: ' + e;
        btn.disabled = false;
      });
    }).catch((e) => {
      status.innerText = 'Precisa permitir o microfone (nao sera usado, so exigido pra abrir a chamada): ' + e.message;
      btn.disabled = false;
    });
  };

  if (peer.open) {
    iniciar();
  } else {
    peer.on('open', iniciar);
  }

  peer.on('error', (err) => {
    status.innerText = '❌ Erro: ' + err.type + (err.type === 'peer-unavailable' ? ' (ID nao encontrado ou Mensageiro offline)' : '');
    btn.disabled = false;
  });
}
</script>
</body>
</html>
